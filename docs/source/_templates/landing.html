<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rubin Rocks</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

html,body{

    margin:0;
    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Inter,sans-serif;

    background:black;
}

/* ------------------------------------------------ */

video{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;
}

/* ------------------------------------------------ */

.overlay{

    position:fixed;

    inset:0;

    background:

        linear-gradient(
            rgba(3,14,28,.40),
            rgba(3,14,28,.65));

    z-index:-1;
}

/* ------------------------------------------------ */

.hero{

    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:2rem;
}

/* ------------------------------------------------ */

.title{

    color:#009fa1;

    font-size:clamp(4rem,8vw,7rem);

    font-weight:700;

    letter-spacing:.08em;

    margin-bottom:.5rem;

    text-shadow:

        0 0 25px rgba(0,180,180,.35);

    opacity:0;

    animation:fadeUp 2s forwards;
}

/* ------------------------------------------------ */

.subtitle{

    color:white;

    font-size:clamp(1.3rem,2vw,2rem);

    font-weight:300;

    max-width:900px;

    line-height:1.5;

    opacity:0;

    animation:fadeUp 2s .8s forwards;
}

/* ------------------------------------------------ */

.button{

    margin-top:3rem;

    display:inline-block;

    padding:1rem 2.8rem;

    border:2px solid white;

    border-radius:40px;

    color:white;

    text-decoration:none;

    font-size:1rem;

    font-weight:600;

    letter-spacing:.08em;

    transition:.3s;

    opacity:0;

    animation:fadeUp 2s 1.6s forwards;
}

.button:hover{

    background:white;

    color:#103B60;
}

/* ------------------------------------------------ */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(25px);
    }

    to{

        opacity:1;

        transform:none;
    }

}

</style>

</head>

<body>

<video autoplay muted loop playsinline>

    <source src="_static/hero.mp4" type="video/mp4">

</video>

<div class="overlay"></div>

<div class="hero">

    <div class="title">

        RUBIN ROCKS

    </div>

    <div class="subtitle">

        Exploring the dynamical histories of near-Earth Objects

    </div>

    <a class="button" href="index.html">

        Documentation

    </a>

</div>

</body>

</html>
